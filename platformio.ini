; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-mini]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
; Dual-slot OTA table (see partitions_4mb_ota.csv for the migration story).
; First flash after switching tables MUST be over USB; WiFi OTA works from
; then on. maximum_size = one ota slot (0x1F0000). The old single-app table
; is kept as partitions_4mb.csv for reference/rollback.
board_build.partitions = partitions_4mb_ota.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 2031616
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
build_src_filter =
  +<*>
  -<test_main.cpp>
  -<pid_webserver_enabled.cpp>
  -<ekf_sim_test.cpp>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  -D FCU_SENSITIVE_PIN_SAFE_BOOT_MS=10000U
  -D FCU_PIN_NRF_MOSI=4
  -D FCU_PIN_NRF_MISO=5
  -D FCU_PIN_NRF_SCK=6
  -D FCU_PIN_CTRL_CSN=7
  -D FCU_PIN_CTRL_CE=15
  -D FCU_PIN_CTRL_IRQ=16
  -D FCU_PIN_TELM_CSN=8
  -D FCU_PIN_TELM_CE=21
  -D FCU_PIN_TELM_IRQ=38
  -D FCU_ENABLE_TELEMETRY_RADIO=1
  -D FCU_PIN_NRF_RX_OK_LED=48
  -D FCU_PIN_NRF_TX_OK_LED=47
  -D FCU_PIN_BATT_ADC=2
  -D FCU_TUNING_LOG_HZ=100
  ; TEMP diagnostic for the left-veer / low-M3 investigation. Emits the [LVLDIAG]
  ; line (raw vs corrected attitude, accel-trust, per-motor mix, integrator/sat
  ; gates). Set to 0 or delete once the cause is confirmed. Inherited by every
  ; env that extends esp32-s3-mini (pidweb bench + flightable wireless).
  -D FCU_LEVEL_DIAG_LOG_HZ=50
  ; Migrated from FlySky FS-X6B iBUS to ExpressLRS. The ELRS receiver speaks
  ; CRSF over UART0 (the controller the iBUS link used), matrix-routed to:
  ;     FCU RX = IO36  <- ELRS receiver TX
  ;     FCU TX = IO37  -> ELRS receiver RX   (FC->handset CRSF telemetry; opt.)
  ; UART1 stays on the GPS (33/34) and UART2 on the Pi autonomy link (17/18).
  ; The separate nRF24 TELEMETRY radio is UNCHANGED and stays on (TELM_* pads).
  ;
  ; Fallback WITHOUT code edits — to the old FlySky iBUS link:
  ;     -D USE_ELRS_CRSF_CONTROL=0  -D USE_FLYSKY_IBUS_CONTROL=1
  ;     -D IBUS_UART_NUM=0  -D IBUS_RX_PIN=15  -D IBUS_BAUD=115200
  ; or to the legacy nRF24 control link (then also disable the servos, which
  ; reuse the nRF24 CTRL pads):
  ;     -D USE_ELRS_CRSF_CONTROL=0  -D USE_NRF24_CONTROL=1  -D USE_CAMERA_PAN_TILT=0
  -D USE_ELRS_CRSF_CONTROL=1
  -D USE_FLYSKY_IBUS_CONTROL=0
  -D USE_NRF24_CONTROL=0
  -D USE_NRF24_TELEMETRY=1
  -D CRSF_RX_PIN=36
  -D CRSF_TX_PIN=37
  -D CRSF_BAUD=420000
  -D CRSF_LINK_TIMEOUT_MS=200U
  ; Small centre deadband (percent) on roll/pitch/yaw; throttle is not deadbanded.
  -D CRSF_DEADBAND_PERCENT=2
  ; Uncomment for a live CRSF channel/health dump (one line/s).
  ; -D CRSF_DEBUG_LOG=1
  ; ---- FC -> handset CRSF telemetry (EdgeTX sensors) -----------------------
  ; The FCU writes CRSF telemetry frames on the ELRS TX wire (GPIO 37); the
  ; receiver forwards them up the RF link. On the handset run Model ->
  ; TELEMETRY -> "Discover new sensors" with the link up. Sensors: RxBt/Bat%
  ; (battery 0x08; current/mAh read 0 — no current sensor), Ptch/Roll/Yaw
  ; (attitude 0x1E), FM (flight-mode text 0x21, resent instantly on
  ; arm/failsafe transitions), GPS/Sats/Alt/Hdg (GPS 0x02 — only once there is
  ; a fresh fix; speed reads 0 until RMC parsing exists, Hdg is IMU yaw not
  ; COG). One frame max per CRSF task tick, only when TX buffer has room —
  ; can never block control decode. Defaults below; set CRSF_FC_TELEMETRY=0
  ; to disable entirely.
  ; -D CRSF_FC_TELEMETRY=1
  ; -D CRSF_TLM_BATTERY_PERIOD_MS=1000U
  ; -D CRSF_TLM_ATTITUDE_PERIOD_MS=200U
  ; -D CRSF_TLM_GPS_PERIOD_MS=1000U
  ; -D CRSF_TLM_GPS_STALE_MS=2500U
  ; -D CRSF_TLM_FLIGHTMODE_PERIOD_MS=500U
  ; ---- FPV camera pan/tilt servos (reuse the freed nRF24 CTRL pads) ---------
  ; PAN  = old CNTRL_CSN pad (FCU_PIN_CTRL_CSN = GPIO 7)
  ; TILT = old CNTRL_IRQ pad (FCU_PIN_CTRL_IRQ = GPIO 16)
  ; ESP32Servo PWM @ 50 Hz, independent of the motor DShot/RMT timers. ELRS aux map:
  ; CH6 -> pan rate, CH7 -> tilt rate. Center holds position; +100 walks
  ; toward max pulse width, -100 walks toward min pulse width until endpoint.
  ; The limits below are the compiled defaults (1000/1500/2000 us);
  ; uncomment to override per servo.
  -D USE_CAMERA_PAN_TILT=1
  ; -D PAN_MIN_US=1000
  ; -D PAN_CENTER_US=1500
  ; -D PAN_MAX_US=2000
  ; -D TILT_MIN_US=1000
  ; -D TILT_CENTER_US=1500
  ; -D TILT_MAX_US=2000
  ; -D CAMERA_SLEW_US_PER_SEC=2000     ; 0 = no smoothing (snap to stick)
  ; -D CAMERA_RECENTER_ON_FAILSAFE=0   ; 0 = hold last position, 1 = recenter
  ; ---- Failsafes re-enabled for flight --------------------------------------
  ; iBUS bringup is done; failsafes back to flight-safe production timing.
  ; The FailsafeManager latches on: control-link timeout, Pi-cmd timeout,
  ; ToF invalid (when alt-hold active), unsafe tilt, IMU invalid, loop overrun.
  ; Set FCU_DISABLE_FAILSAFES=1 again only for a bench session where you
  ; explicitly want the controller to keep running with no link.
  -D FCU_DISABLE_FAILSAFES=1
  -D FCU_FAILSAFE_PRODUCTION=1
  ; ---- Subsystems re-enabled for hover/RTH bringup --------------------------
  ; GPS is back on UART1 (HardwareSerial(1)) at its original pads (TX=33,
  ; RX=34). ToF is back so the auto-landing PID and altitude-hold can use it.
  ; Auto-takeoff + altitude-hold still gated by their own flags so you can
  ; bring each on independently. Pi autonomy UART stays disabled until the
  ; Pi side is ready.
  -D FCU_ENABLE_TOF=1
  -D FCU_ENABLE_AUTONOMY_UART=0
  -D FCU_ENABLE_AUTO_TAKEOFF=1
  -D FCU_ENABLE_ALTITUDE_HOLD=1
  -D FCU_ENABLE_GPS=1
  ; The onboard ICM-20948 magnetometer is too close to the powered airframe to
  ; be trusted as a yaw reference. Keep mag telemetry/calibration visible, but
  ; do not let compass interference pull the manual yaw estimate around.
  ; GPS/RTH/mission guards still require a valid calibrated compass until those
  ; modes get a GPS-course/dual-antenna heading fallback.
  -D FCU_ENABLE_MAG_YAW_FUSION=0
  ; ---- New autonomy controllers (velocity/position/landing/RTH) -------------
  ; Each one is gated separately so you can bring them up incrementally on the
  ; bench. Defaults are bench-safe (controllers compiled in, but disengaged
  ; unless the flight mode switch explicitly activates them).
  -D FCU_ENABLE_VELOCITY_CTRL=1
  -D FCU_ENABLE_POSITION_CTRL=1
  -D FCU_ENABLE_TOF_LANDING=1
  -D FCU_ENABLE_RTH=1
  ; ---- Bench-rig pitch-axis log --------------------------------------------
  ; When the airframe is on a pitch-only test rig, the default [TUNE] line
  ; (roll axis) shows nothing useful. Uncomment this to emit a parallel
  ; [TUNE_P] line with pitch P/I/D/output and pitch angle for tuning.
  ; Keep COMMENTED OUT during free-flight to halve serial bandwidth.
  ; -D FCU_TUNE_PITCH_LOG=1
  ; ---- Throttle ceiling (heavier-payload bump) -----------------------------
  ; Active env 1900 = about 93% of DShot range. Source fallback remains 1500;
  ; this build override is the actual flight/wireless ceiling.
  ; See main.cpp comment block above MOTOR_OUTPUT_MAX_RAW — values above
  ; ~1850 should be paired with a re-run of env:fcu_motor_fft_test to
  ; verify notch tuning still hits the motor fundamental.
  -D FCU_MOTOR_OUTPUT_MAX_RAW=1900
  ; ---- Front-only pitch bias (forward-CG compensation) ---------------------
  ; Multiplier applied to the FRONT-motor pitch correction only. Rear motors
  ; keep their tuned response (×1.0). Use this when the drone is front-heavy
  ; and the rears feel "stronger" on tilt recovery — front gets boosted to
  ; match instead of weakening the rear. Default 1.0 = legacy symmetric mixer.
  ; Suggested ladder: 1.2 (mild), 1.3 (moderate), 1.5 (aggressive).
  ; Compile-clamped to [1.0, 2.0] in main.cpp.
  -D FCU_MIX_PITCH_FRONT_BIAS=1.0f
  ; ---- Recovery authority (large-tilt fight-back) --------------------------
  ; Two ceilings combine to determine how hard the controller can push at
  ; large tilts. Defaults 120/120 → drone "gives up" past ~24° tilt because
  ; the angle→rate conversion caps at 120 dps (with AngleP=5.0). Bump both
  ; to ~250 to push the saturation point past 45° tilt.
  ; Suggested ladder (raise together; keep equal):
  ;   180 → recovery to ~36°
  ;   240 → recovery to ~48°
  ;   300 → recovery to ~60°
  ; Note: raising these enables larger I-term accumulation (integral clamp
  ; tracks PID_OUTPUT_LIMIT_RAW) and slightly stronger motor commands during
  ; transients — verify hover stability after bumping.
   -D FCU_MAX_ANGLE_RATE_SETPOINT_DPS=240.0f
  -D FCU_PID_OUTPUT_LIMIT_RAW=240.0f
  ; ---- Rate-PID derivative + anti-windup hardening -------------------------
  ; D-on-MEASUREMENT removes the motor "derivative kick" on stick/setpoint
  ; steps (no effect while kd=0, but makes the D path correct for when you add
  ; D after prop-balancing). Set =0 for the legacy D-on-error behaviour.
  -D FCU_PID_DERIV_ON_MEASUREMENT=1
  ; First-order low-pass on the D term (Hz) — tames gyro-noise amplification.
  ; 0 disables. 100 Hz is a conservative default for the 500 Hz loop.
  -D FCU_PID_DTERM_LPF_HZ=100.0f
  ; Integral clamp, DECOUPLED from the output ceiling. Previously the I state
  ; was clamped to ±FCU_PID_OUTPUT_LIMIT_RAW, so bumping the ceiling to 240
  ; silently doubled allowed I-windup. 0.6x leaves headroom for P+D; set equal
  ; to FCU_PID_OUTPUT_LIMIT_RAW (=240.0f) to restore the old behaviour.
  -D FCU_PID_INTEGRAL_LIMIT_RAW=144.0f
  ; ---- Armed idle (active-flight-path safety fix, 2026-06) ------------------
  ; Default ON (=1, set in main.cpp). While ARMED with zero throttle the motors
  ; now hold DShot 48 (the existing minimum-active command) and the rate PIDs
  ; stay live with frozen integrators, instead of the old forceMotorStop()+PID
  ; reset. A mid-air throttle chop is now recoverable.
  ; !! ARMING (CH5 high after safe-boot) NOW SPINS THE PROPS AT IDLE ON THE
  ; !! GROUND, like every market FCU. Run the props-off checklist in
  ; !! ACTIVE_FLIGHT_PATH_FIXES.md before flying this build.
  ; Current bench/bring-up mode: stop motors at zero throttle while armed.
  ; Re-enable armed idle only after level attitude + mixer signs are validated.
  -D FCU_ARMED_IDLE_ENABLE=0
  ; ---- EKF shadow validation (ENABLE_EXPERIMENTAL_EKF=1 by default) ---------
  ; The error-state EKF runs in SHADOW (estimate published; mixer untouched
  ; unless ENABLE_EXPERIMENTAL_EKF_CONTROL=1). Validated in sim by
  ; src/ekf_sim_test.cpp (envs ekf_sim / native_ekf_sim).
  ; Capture one flight to compare the EKF vs the live complementary filter
  ; offline — emits [EKF] lines (~10 Hz) over serial:
  ; -D FCU_EKF_SHADOW_LOG=1
  ; Feed EKF loop-rate velocity to the (future) POS_HOLD velocity loop instead
  ; of low-rate GPS. Leave OFF until the EKF is flight-validated; ekf_sim_test
  ; S9 shows it holds a target velocity to ~0.15 m/s closed-loop in sim.
  ; -D FCU_USE_EKF_VELOCITY=1
  ; ---- Wireless logging / OTA (ALL OFF by default — flight image is silent) -
  ; Motivation: the USB-C port is unreliable, so logs and firmware updates can
  ; move to WiFi — but ONLY while DISARMED with motors stopped. Arming forces
  ; an immediate WiFi teardown, and after any disarm the AUX switch must make
  ; a fresh OFF->ON edge to re-enable (no silent auto-reconnect after landing).
  ; Credentials/auth come from the gitignored src/pidweb_secrets.h (same file
  ; the bench tuner uses); any WiFi-enabled build #errors without it.
  ;
  ; Typical field-update configuration (uncomment these five):
  ;   -D FCU_ENABLE_WIFI_LOGGING=1            ; UDP log push (port 5005)
  ;   -D FCU_ENABLE_WIFI_OTA=1                ; POST /ota firmware upload
  ;   -D FCU_ENABLE_RADIO_WIFI_TOGGLE=1       ; AUX switch enables WiFi
  ;   -D FCU_WIFI_TOGGLE_AUX_CHANNEL=9        ; 2-pos switch on CRSF CH9
  ;   -D FCU_WIFI_LOG_UDP_TARGET="\"192.168.1.50\""  ; optional unicast; empty
  ;                                           ; (default) = subnet broadcast
  ; Listen on the PC with:  nc -ul 5005   (or any UDP capture tool).
  ; OTA upload (disarmed only):
  ;   curl -X POST --data-binary @.pio/build/esp32-s3-mini/firmware.bin ^
  ;        -H "X-Auth-Token: <FCU_PID_AUTH_TOKEN>" http://<fcu-ip>/ota
  ;
  ; Channel map reminder: CH1-4 sticks, CH5 arm, CH6/CH7 camera gimbal ->
  ; the toggle must live on CH9+ (compile-enforced). The toggle is debounced
  ; (FCU_WIFI_TOGGLE_DEBOUNCE_MS=750) on
  ; top of the standard switch hysteresis, and enable requests are IGNORED
  ; while armed.
  ;
  ; While the WiFi log sink is live, USB serial output drops to Error/Critical
  ; only (FCU_USB_LOG_SUSPEND_WHEN_WIFI=1, the code default) so the firmware
  ; stops depending on a healthy USB connection. Set =0 to keep full USB logs.
  ; FCU_ENABLE_BLE_LOGGING is RESERVED (compile-error if =1): BLE+WiFi coex
  ; is deliberately not implemented yet.
  ;
  ; Code defaults (include/wifi_manager.h + include/log_router.h) — flight env
  ; deliberately defines NONE of these, so this image has zero wireless code:
  ;   FCU_ENABLE_WIFI_LOGGING=0        FCU_ENABLE_WIFI_OTA=0
  ;   FCU_ENABLE_BLE_LOGGING=0         FCU_ENABLE_RADIO_WIFI_TOGGLE=0
  ;   FCU_WIFI_TOGGLE_AUX_CHANNEL=0    FCU_WIFI_TOGGLE_DEBOUNCE_MS=750U
  ;   FCU_ENABLE_USB_SERIAL_LOGGING=1  FCU_USB_LOG_SUSPEND_WHEN_WIFI=1
  ;   FCU_WIFI_LOG_UDP_PORT=5005       FCU_WIFI_LOG_UDP_TARGET=""
  ; Ready-made field config: [env:esp32-s3-mini-wireless] at the bottom of
  ; this file (WiFi logging + OTA + CH9 toggle, everything else identical).
  ; ---- Bus speeds (production caps) ----------------------------------------
  ; Defaults in main.cpp are 1 MHz for both buses (conservative bench start).
  ; ICM-20948 datasheet allows 7 MHz SPI reads; nRF24L01+ allows 10 MHz.
  ; Library init does a graceful fall-back chain if the chip rejects the
  ; requested clock, so these are safe to ask for.
  -D FCU_IMU_SPI_HZ=7000000UL
  -D FCU_RADIO_SPI_HZ=10000000UL
  ; --------------------------------------------------------------------------
  ; Dynamic notch — validated 2026-05 on this airframe (sqrt mapping, Q=2.5,
  ; LOW_CMD=45 Hz, HIGH_CMD=122 Hz for the 1900 ceiling). A/B sweep showed
  ; -5 to -6 dB on the fundamental band across all three gyro axes.
  ; Defaults in src/main.cpp; the high endpoint is overridden here.
  ; Set to 0 (or remove this line) to disable notch and revert to raw gyro.
  -D ENABLE_DYNAMIC_NOTCH=1
  -D DYN_NOTCH_HIGH_CMD_HZ=122.0f
  
  ; Uncomment to print [DYN_NOTCH] log lines once per second showing the
  ; notch center frequency and target tracking. Useful during the first
  ; flight; turn off afterwards to keep serial bandwidth for [LAT]/[TUNE].
  ; -D DYN_NOTCH_DEBUG=1
  ; ----------------------------------------------------------------------
  ; Bench tuning debug. When enabled, emits comprehensive [TUNE_DBG] lines
  ; at FCU_TUNING_DEBUG_HZ (default 50). One line per emit contains raw
  ; gyro / filtered gyro / attitude / setpoints / PID terms / motor outputs.
  ; KEEP OFF DURING FLIGHT — heavy USB CDC traffic. Toggle for bench tests.
  ; UNCOMMENT THESE THREE BLOCKS WHEN RETURNING TO THE BENCH.
  ; -D FCU_TUNING_DEBUG=1
  ; -D FCU_TUNING_DEBUG_HZ=50
  ; Pitch/roll adapter bench rig diagnostics. PITCH_RIG adds accel magnitude,
  ; raw-vs-filtered pitch gyro, pitch PID, and front-vs-rear motor correction.
  ; Disable before flight.
  ; -D FCU_PITCH_RIG_DEBUG=1
  ; -D FCU_PITCH_RIG_DEBUG_HZ=25
  ; Bench/tuning mode: only unsafe tilt latches failsafe. DO NOT FLY with this on.
  ; -D FCU_FAILSAFE_TILT_ONLY=1
  ; ---- Bidirectional DShot (ESC RPM/voltage/current/temperature telemetry) ---
  ; Set to 1 to enable bidirectional DShot on all four motors. Each motor pin
  ; is switched to open-drain mode and the patched easy-esc library polls the
  ; ESC's GCR-encoded response every output-refresh tick (~500 Hz).
  ;
  ; HARDWARE REQUIRED: 4.7 kΩ pull-up from each motor signal line to 3.3 V at
  ; the FC end. The user-provided pull-ups must be in place before flipping
  ; this on or the decoder will see no valid frames.
  ;
  ; BENCH TEST FIRST. The non-bidirectional path is the proven working one;
  ; bidirectional engages a code path that has not been flown on this airframe.
  ; Suggested validation sequence:
  ;   1. Set to 1, reflash.
  ;   2. Boot: expect 4 × "[RMT] bidir mode motor=N gpio=M ..." lines.
  ;   3. Arm + ~20% throttle (PROPS OFF) and call gMotor*.telemetry() in a
  ;      log line. .valid should turn true within a few hundred ms, and
  ;      .erpm should track throttle.
  ;   4. If .valid stays false, the upstream DShotRMT stack-buffer race is the
  ;      next thing to fix (see esc_dshot_output.cpp comments).
  ; -D FCU_DSHOT_BIDIR=1
  ; ---- ESC UART telemetry (KISS TLM wire on GPIO 15) -------------------------
  ; Round-robin polls each ESC's 10-byte KISS frame (temp/volts/amps/mAh/eRPM)
  ; by setting the DShot telemetry-request bit one motor at a time; the reply
  ; arrives on the shared TLM wire at 115200. Feeds the 1 Hz [ESC_TLM] serial
  ; line and the current/mAh fields of the CRSF battery sensor on the handset.
  ; WIRING: ESC TLM pad -> GPIO 15 (the freed nRF24 CTRL_CE pad — the last
  ; spare ex-control-radio pin; CSN 7 / IRQ 16 are the camera servos), common
  ; ground. Needs BLHeli_32 / AM32 / KISS firmware (plain BLHeli_S has no TLM
  ; output).
  ; CONSTRAINTS (compile-enforced): reuses UART2 -> mutually exclusive with
  ; FCU_ENABLE_AUTONOMY_UART; conflicts with FCU_DSHOT_BIDIR (which owns the
  ; telemetry bit), with USE_NRF24_CONTROL and with the iBus fallback (whose
  ; default RX pin is also GPIO 15). Telemetry only flows while motors are
  ; driven (armed idle counts). Uncomment to enable after wiring:
  ; -D FCU_ESC_TELEM=1
  ; -D FCU_PIN_ESC_TELEM=15
  ; -D FCU_ESC_TELEM_POLE_PAIRS=7   ; 14-magnet outrunner -> mechanical RPM
lib_deps =
  ; easy-esc-esp32 is vendored in lib/easy-esc-esp32 for BDShot telemetry support.
  nrf24/RF24 @ ^1.4.11
  madhephaestus/ESP32Servo @ ^3.2.1
  adafruit/Adafruit ICM20X @ ^2.0.7
  adafruit/Adafruit VL53L1X @ ^3.1.2
  adafruit/Adafruit BMP280 Library @ ^2.6.8

[env:esp32-s3-mini-pidweb]
extends = env:esp32-s3-mini
build_src_filter =
  +<*>
  -<test_main.cpp>
  -<pid_webserver.cpp>
  -<ekf_sim_test.cpp>
build_flags =
  ${env:esp32-s3-mini.build_flags}
  -D ENABLE_PID_WEBSERVER=1
  ; BENCH-ONLY / NOT FLIGHTABLE: this build disables the flight failsafes so the
  ; tuner can run with no control link. Never fly a pidweb image. A compile-time
  ; #warning + a boot banner make this loud. Do NOT let another env `extends`
  ; this one (it would silently inherit FCU_DISABLE_FAILSAFES).
  -D FCU_DISABLE_FAILSAFES=1
  ; WiFi credentials + the HTTP auth token are SECRET and must NOT be committed.
  ; Copy src/pidweb_secrets.h.example to src/pidweb_secrets.h (gitignored) and
  ; fill in FCU_PID_WIFI_SSID / FCU_PID_WIFI_PASS / FCU_PID_AUTH_TOKEN there.
  ; The build #errors if that header is missing.

; -----------------------------------------------------------------------------
; FLIGHTABLE wireless variant: the flight env + WiFi logging/OTA + CH9 toggle.
; This is NOT the bench pidweb env — failsafes stay fully ENABLED. The WiFi
; stack only runs while DISARMED (motors stopped, FSM idle); arming tears it
; down and the CH9 switch then needs a fresh OFF->ON edge to re-enable.
; Requires src/pidweb_secrets.h (gitignored) for SSID/pass/auth token.
;
; Use:   pio run -e esp32-s3-mini-wireless -t upload     (first flash via USB)
; Logs:  flip CH9 high while disarmed, then on the PC:   nc -ul 5005
; OTA:   curl -X POST --data-binary @.pio/build/esp32-s3-mini-wireless/firmware.bin \
;             -H "X-Auth-Token: <FCU_PID_AUTH_TOKEN>" http://<fcu-ip>/ota
; -----------------------------------------------------------------------------
[env:esp32-s3-mini-wireless]
extends = env:esp32-s3-mini
build_flags =
  ${env:esp32-s3-mini.build_flags}
  -D FCU_ENABLE_WIFI_LOGGING=1
  -D FCU_ENABLE_WIFI_OTA=1
  -D FCU_ENABLE_RADIO_WIFI_TOGGLE=1
  -D FCU_WIFI_TOGGLE_AUX_CHANNEL=9
  -D CRSF_DEBUG_LOG=1
  ; Normal one-way DShot. Use esp32-s3-mini-wireless-bdshot only for bench
  ; testing signal-wire RPM telemetry.
  -D FCU_DSHOT_BIDIR=0
  -D FCU_ENABLE_RPM_FILTER=0
  ; Optional: unicast the UDP logs to one PC instead of subnet broadcast.
  ; -D FCU_WIFI_LOG_UDP_TARGET="\"192.168.1.50\""

; -----------------------------------------------------------------------------
; Bench BDShot wireless variant: signal-wire eRPM + RPM-filter debug.
; Requires 4.7k pull-ups from each motor signal line to 3.3V and props off for
; first spin test. Do not use this when the ESCs are configured for normal
; one-way DShot.
; -----------------------------------------------------------------------------
[env:esp32-s3-mini-wireless-bdshot]
extends = env:esp32-s3-mini
build_flags =
  ${env:esp32-s3-mini.build_flags}
  -D FCU_ENABLE_WIFI_LOGGING=1
  -D FCU_ENABLE_WIFI_OTA=1
  -D FCU_ENABLE_RADIO_WIFI_TOGGLE=1
  -D FCU_WIFI_TOGGLE_AUX_CHANNEL=9
  -D FCU_DSHOT_BIDIR=1
  -D FCU_ENABLE_RPM_FILTER=1
  -D FCU_RPM_FILTER_DEBUG=1

; -----------------------------------------------------------------------------
; Alternate ESC TLM-wire build: KISS/BLHeli_32/AM32 10-byte telemetry over the
; ESC TLM pad on GPIO15. This cannot be combined with FCU_DSHOT_BIDIR because
; both paths own the DShot telemetry-request bit.
; -----------------------------------------------------------------------------
[env:esp32-s3-mini-wireless-esc-tlm]
extends = env:esp32-s3-mini
build_flags =
  ${env:esp32-s3-mini.build_flags}
  -D FCU_ENABLE_WIFI_LOGGING=1
  -D FCU_ENABLE_WIFI_OTA=1
  -D FCU_ENABLE_RADIO_WIFI_TOGGLE=1
  -D FCU_WIFI_TOGGLE_AUX_CHANNEL=9
  -D FCU_ESC_TELEM=1
  -D FCU_PIN_ESC_TELEM=15
  -D FCU_ESC_TELEM_POLE_PAIRS=7
  ; Optional: unicast the UDP logs to one PC instead of subnet broadcast.
  ; -D FCU_WIFI_LOG_UDP_TARGET="\"192.168.1.50\""

; -----------------------------------------------------------------------------
; ESC passthrough bench env: the flight firmware + the USB-CDC ESC passthrough
; mode (src/esc_usb_passthrough.cpp). Identical to the flight env otherwise, so
; the default flight image is byte-for-byte unaffected and USB upload is unchanged.
;
; SAFETY / STATUS: this enables a SAFE SCAFFOLD with an honest DRY-RUN byte pump.
; It does NOT yet speak the AM32 4-way/bootloader protocol, so it cannot flash or
; configure the ESC yet — it only proves the disarm gating, the real DShot
; suspend/restore handoff, serial-activity detection and the inactivity timeout.
; See docs/ESC_PASSTHROUGH_AM32_DESIGN.md for the protocol study / next step.
;
; Use:  pio run -e esp32-s3-mini-escpass -t upload
;       then open the COM port (115200) and type:  esc passthrough on
; PROPS OFF. Disarm (flight switch OFF) before enabling.
; -----------------------------------------------------------------------------
[env:esp32-s3-mini-escpass]
extends = env:esp32-s3-mini
build_flags =
  ${env:esp32-s3-mini.build_flags}
  -D ENABLE_ESC_PASSTHROUGH=1
  ; Auto-exit after this many ms with no USB serial activity.
  -D ESC_PASSTHROUGH_TIMEOUT_MS=60000UL
  ; Uncomment for verbose dry-run byte logging.
  ; -D ESC_PASSTHROUGH_DEBUG_LOGS=1

; -----------------------------------------------------------------------------
; Windows FCU Configurator bench image.
;
; Adds the binary USB configurator endpoint without starting the WiFi PID web UI.
; USB log-router output is disabled so normal runtime logs do not interleave with
; protocol frames. setup()-time boot text can still appear before the app
; handshakes; the desktop parser resynchronizes on the binary frame sync bytes.
;
; Use:  pio run -e esp32-s3-mini-configurator -t upload
;       then connect from configurator/ over the detected COM port.
; SAFETY: bench/configuration target. Do not call it a flight release until the
; failsafe flag and performance measurements are audited.
; -----------------------------------------------------------------------------
[env:esp32-s3-mini-configurator]
extends = env:esp32-s3-mini
build_flags =
  ${env:esp32-s3-mini.build_flags}
  -D BUILD_RELEASE=1
  -D ENABLE_WIFI_CONFIG=0
  -D ENABLE_USB_CONFIG=1
  -D ENABLE_BLE_CONFIG=1
  -D BLE_DEFAULT_ENABLED=1
  -D ENABLE_RUNTIME_LOG_STREAM=0
  -D ENABLE_VERBOSE_SERIAL_LOGS=0
  -D ENABLE_TRACE_LOGS=0
  -D ENABLE_DEBUG_SENSOR_DUMPS=0
  -D ENABLE_ERROR_EVENT_BUFFER=1
  -D ENABLE_PERFORMANCE_METRICS=1
  -D FCU_ENABLE_USB_SERIAL_LOGGING=0

[env:test]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D FCU_PIN_NRF_MOSI=4
  -D FCU_PIN_NRF_MISO=5
  -D FCU_PIN_NRF_SCK=6
  -D FCU_PIN_CTRL_CSN=7
  -D FCU_PIN_CTRL_CE=15
  -D FCU_PIN_CTRL_IRQ=16
  -D FCU_PIN_TELM_CSN=8
  -D FCU_PIN_TELM_CE=21
  -D FCU_PIN_TELM_IRQ=38
  -D FCU_ENABLE_TELEMETRY_RADIO=1
  -D FCU_PIN_NRF_RX_OK_LED=47
  -D FCU_PIN_NRF_TX_OK_LED=48
  -D FCU_RADIO_SPI_HZ=10000000UL
  -D FCU_IMU_SPI_HZ=7000000UL
  -D FCU_TUNING_LOG_HZ=100
build_src_filter =
  -<*>
  +<test_main.cpp>
lib_deps =
  nrf24/RF24 @ ^1.4.11
  adafruit/Adafruit ICM20X @ ^2.0.7
  adafruit/Adafruit VL53L1X @ ^3.1.2

; -----------------------------------------------------------------------------
; Motor vibration / FFT test environment.
;
; Mirrors [env:esp32-s3-mini] (the working flight env) byte-for-byte, with
; only three differences:
;   - build_src_filter compiles motor_fft_test.cpp INSTEAD of main.cpp
;   - MOTOR_FFT_TEST_MODE=1 / DISABLE_NORMAL_FLIGHT=1 are added
;   - the env name
; Matching the rest of the flight env keeps the Arduino-ESP32 / IDF
; configuration identical, which matters because the easy_esc DShot library
; allocates RMT channels at startup and is sensitive to surrounding init.
; SAFETY: remove props for motor mapping.
; -----------------------------------------------------------------------------
[env:fcu_motor_fft_test]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
; Compile the test main + the dynamic-notch sources only. The flight main.cpp
; stays excluded so the test binary doesn't try to bring up radios/PID/etc.
; BiquadFilter.cpp + DynamicNotchFilter.cpp are pulled in so the NOTCH
; command on the test build uses the EXACT same filter code path as the
; flight firmware — any A/B result here is a true validation of what the
; FCU will do at the same DShot in flight.
build_src_filter =
  -<*>
  +<motor_fft_test.cpp>
  +<BiquadFilter.cpp>
  +<DynamicNotchFilter.cpp>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  -D MOTOR_FFT_TEST_MODE=1
  -D DISABLE_NORMAL_FLIGHT=1
  -D MOTOR_FFT_SERIAL_BAUD=921600UL
  ; Dynamic-notch test build: compiled in, default ON. Toggle at runtime with
  ; NOTCH ON / NOTCH OFF before each sweep to A/B raw vs filtered captures.
  -D ENABLE_DYNAMIC_NOTCH=1
  -D MOTOR_FFT_SWEEP_DEFAULT_MAX=1900U
  -D DYN_NOTCH_MAX_CMD=1900U
  -D DYN_NOTCH_HIGH_CMD_HZ=122.0f
  -D FCU_SENSITIVE_PIN_SAFE_BOOT_MS=10000U
  -D FCU_PIN_NRF_MOSI=4
  -D FCU_PIN_NRF_MISO=5
  -D FCU_PIN_NRF_SCK=6
  -D FCU_PIN_CTRL_CSN=7
  -D FCU_PIN_CTRL_CE=15
  -D FCU_PIN_CTRL_IRQ=16
  -D FCU_PIN_TELM_CSN=8
  -D FCU_PIN_TELM_CE=21
  -D FCU_PIN_TELM_IRQ=38
  -D FCU_ENABLE_TELEMETRY_RADIO=1
  -D FCU_PIN_NRF_RX_OK_LED=48
  -D FCU_PIN_NRF_TX_OK_LED=47
  -D FCU_PIN_BATT_ADC=2
lib_deps =
  ; easy-esc-esp32 is vendored in lib/easy-esc-esp32 for BDShot telemetry support.
  nrf24/RF24 @ ^1.4.11
  adafruit/Adafruit ICM20X @ ^2.0.7
  adafruit/Adafruit VL53L1X @ ^3.1.2
  adafruit/Adafruit BMP280 Library @ ^2.6.8

; Explicit high-power variant for full-range motor sweeps.
; Build/upload this only for a restrained test stand with props removed or
; otherwise controlled. The normal fcu_motor_fft_test env stays capped at 350.
[env:fcu_motor_fft_test_full_dshot]
extends = env:fcu_motor_fft_test
build_flags =
  ${env:fcu_motor_fft_test.build_flags}
  -D MOTOR_FFT_SWEEP_HARD_MAX=2047U

; -----------------------------------------------------------------------------
; Bench test env. Auto-sequenced 3-minute test that walks through:
;   1. Motor direction verification (each motor spins 5s at low DShot)
;   2. Smooth throttle ramp 0 -> ~30% -> 0 over 20s (all 4 motors)
;   3. IMU baseline (5s still)
;   4. Six tilt tests (forward / back / right / left / yaw CW / yaw CCW)
;      with 5s prep + 8s hold each
;
; All tilt tests run with motors STOPPED (drone safe to hand-tilt with nothing
; tied down). Simulated PID+mixer outputs are logged so we can verify which
; motors WOULD speed up for each tilt — no actual force on the frame.
;
; Use:  pio run -e fcu_bench_test -t upload
;       pio device monitor -e fcu_bench_test --filter log2file
;       (test runs automatically; capture the log file)
;
; SAFETY: PROPS OFF. Always.
; -----------------------------------------------------------------------------
[env:fcu_bench_test]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
build_src_filter =
  -<*>
  +<bench_test.cpp>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  -D BENCH_TEST_MODE=1
  -D FCU_SENSITIVE_PIN_SAFE_BOOT_MS=10000U
lib_deps =
  ; easy-esc-esp32 is vendored in lib/easy-esc-esp32 for BDShot telemetry support.
  adafruit/Adafruit ICM20X @ ^2.0.7

; -----------------------------------------------------------------------------
; EKF synthetic-trajectory test — drives EstimatorEKF (include/ekf_estimator.h)
; with mock sensors from SimHarness (include/sim_harness.h) and scores the
; estimate against known ground truth. Compiles ONLY src/ekf_sim_test.cpp.
;
; On-target (read [EKF-SIM] results @115200 over USB serial):
;     pio run -e ekf_sim -t upload && pio device monitor -e ekf_sim
; -----------------------------------------------------------------------------
[env:ekf_sim]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_src_filter =
  -<*>
  +<ekf_sim_test.cpp>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; -----------------------------------------------------------------------------
; Same EKF test, built NATIVELY for the dev host (real numbers, no hardware).
; Requires a host C++ compiler (gcc/clang/MSVC) on PATH.
;     pio run -e native_ekf_sim
;     .pio/build/native_ekf_sim/program       (program.exe on Windows)
; Exit code 0 = all scenarios passed.
; -----------------------------------------------------------------------------
[env:native_ekf_sim]
platform = native
build_src_filter =
  -<*>
  +<ekf_sim_test.cpp>
build_flags =
  -std=gnu++17
